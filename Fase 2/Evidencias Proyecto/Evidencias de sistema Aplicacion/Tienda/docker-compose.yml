services:
  dev:
    build: .
    working_dir: /app
    command:
      - uvicorn
      - server:app
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --reload
      - --reload-exclude
      - frontend/**
      - --reload-exclude
      - node_modules/**
      - --reload-exclude
      - .venv/**
      - --reload-exclude
      - build/**
      - --reload-exclude
      - dist/**
    ports:
      - "8765:8765"
    environment:
      GIRASOL_DB_PATH: /app/data/girasol.db
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: app_user
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en el entorno o en .env}
      DB_DATABASE: tienda_online
      DB_CONNECT_TIMEOUT: "5"
    volumes:
      - .:/app
    depends_on:
      - mariadb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8765
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - dev

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en el entorno o en .env}
      MARIADB_USER: app_user
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en el entorno o en .env}
      MARIADB_DATABASE: tienda_online
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_data:
  frontend_node_modules:
