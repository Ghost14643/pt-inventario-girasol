services:
  dev:
    build:
      context: .
      dockerfile: DockerFile
    ports:
      - "8765:8765"
    environment:
      TIENDA_API_HOST: 0.0.0.0
      DB_HOST: ${DB_HOST_DOCKER:-host.docker.internal}
      DB_PORT: ${DB_PORT_DOCKER:-3307}
    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8765
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - dev

volumes:
  frontend_node_modules: