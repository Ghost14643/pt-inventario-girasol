services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Configura MARIADB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${DB_DATABASE:-tienda_online}
      MARIADB_USER: ${DB_USER:-app_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 20

  dev:
    build:
      context: .
      dockerfile: DockerFile
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8765", "--reload"]
    ports:
      - "8765:8765"
    environment:
      TIENDA_API_HOST: 0.0.0.0
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      DB_DATABASE: ${DB_DATABASE:-tienda_online}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-girasol}
      GIRASOL_DB_PATH: /data/girasol.db
    volumes:
      - .:/app
      - ./data:/data
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8765}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - dev

volumes:
  mariadb_data:
  mongodb_data:
  frontend_node_modules:
