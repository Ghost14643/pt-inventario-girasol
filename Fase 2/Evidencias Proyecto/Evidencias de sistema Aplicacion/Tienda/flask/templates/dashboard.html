<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boutique — Daily Sales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #f7f3ee;
      --warm:    #ede7dd;
      --sand:    #d4c9b8;
      --taupe:   #9e8f7e;
      --brown:   #5c4a38;
      --ink:     #2a2018;
      --rose:    #c9826a;
      --sage:    #7a9e7e;
      --r:       10px;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--ink);
      color: var(--cream);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .brand span { color: var(--sand); font-style: italic; }
    .header-meta {
      font-size: .72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--taupe);
    }
    #today-date { color: var(--sand); }

    /* ── Page ── */
    main { max-width: 1100px; margin: 0 auto; padding: 40px 24px 60px; }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 300;
      color: var(--brown);
      margin-bottom: 6px;
    }
    .page-sub {
      font-size: .75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--taupe);
      margin-bottom: 36px;
    }

    /* ── KPI Strip ── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--sand);
      border: 1px solid var(--sand);
      border-radius: var(--r);
      overflow: hidden;
      margin-bottom: 28px;
    }
    .kpi {
      background: #fff;
      padding: 24px 20px 20px;
      text-align: center;
      transition: background .2s;
    }
    .kpi:hover { background: var(--warm); }
    .kpi-label {
      font-size: .67rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--taupe);
      margin-bottom: 8px;
    }
    .kpi-val {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 300;
      color: var(--ink);
      line-height: 1;
      margin-bottom: 6px;
    }
    .kpi-delta {
      font-size: .68rem;
      letter-spacing: .5px;
    }
    .up   { color: var(--sage); }
    .down { color: var(--rose); }
    .flat { color: var(--taupe); }

    /* ── Two-col layout ── */
    .cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-bottom: 20px; }

    /* ── Card ── */
    .card {
      background: #fff;
      border: 1px solid var(--warm);
      border-radius: var(--r);
      padding: 24px;
    }
    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--brown);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: .67rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--taupe);
      margin-bottom: 20px;
    }
    .chart-wrap canvas { width: 100% !important; height: 180px !important; }

    /* ── Top items ── */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--warm);
      gap: 12px;
    }
    .item-row:last-child { border-bottom: none; }
    .item-name { font-size: .85rem; color: var(--ink); }
    .item-cat  { font-size: .67rem; letter-spacing: 1px; text-transform: uppercase; color: var(--taupe); margin-top: 2px; }
    .item-rev  {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--brown);
      white-space: nowrap;
    }
    .item-bar-bg { height: 2px; background: var(--warm); border-radius: 1px; margin-top: 6px; }
    .item-bar    { height: 100%; background: var(--rose); border-radius: 1px; transition: width .6s ease; }

    /* ── Recent table ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      font-size: .65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--taupe);
      font-weight: 400;
      text-align: left;
      padding: 0 0 12px;
      border-bottom: 1px solid var(--warm);
    }
    td {
      padding: 11px 0;
      font-size: .82rem;
      color: var(--ink);
      border-bottom: 1px solid var(--warm);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    .pill {
      display: inline-block;
      font-size: .62rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--sand);
      color: var(--taupe);
    }
    .amt { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--brown); }
    .time-col { color: var(--taupe); font-size: .75rem; }

    /* ── Footer ── */
    footer {
      text-align: center;
      font-size: .68rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--sand);
      padding: 24px 0 0;
    }

    /* ── Skeleton ── */
    .skel {
      background: linear-gradient(90deg, var(--warm) 25%, var(--cream) 50%, var(--warm) 75%);
      background-size: 200% 100%;
      animation: sh 1.4s infinite;
      border-radius: 4px;
    }
    @keyframes sh { from{background-position:200% 0} to{background-position:-200% 0} }

    /* ── Fade in ── */
    .fade { animation: fi .5s ease both; }
    @keyframes fi { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

    @media(max-width:720px){
      .kpi-row { grid-template-columns: 1fr 1fr; }
      .cols    { grid-template-columns: 1fr; }
      header   { padding: 16px 20px; }
      main     { padding: 24px 16px 40px; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">La <span>Maison</span></div>
  <div class="header-meta">Daily report &nbsp;·&nbsp; <span id="today-date"></span></div>
</header>

<main>
  <p class="page-title">Sales Overview</p>
  <p class="page-sub">Today at a glance</p>

  <!-- KPIs -->
  <div class="kpi-row" id="kpi-row">
    <div class="kpi"><div class="kpi-label">Revenue</div><div class="kpi-val skel" style="height:2.2rem;width:80px;margin:0 auto 6px">&nbsp;</div></div>
    <div class="kpi"><div class="kpi-label">Orders</div><div class="kpi-val skel" style="height:2.2rem;width:60px;margin:0 auto 6px">&nbsp;</div></div>
    <div class="kpi"><div class="kpi-label">Units</div><div class="kpi-val skel" style="height:2.2rem;width:60px;margin:0 auto 6px">&nbsp;</div></div>
    <div class="kpi"><div class="kpi-label">Avg. Ticket</div><div class="kpi-val skel" style="height:2.2rem;width:70px;margin:0 auto 6px">&nbsp;</div></div>
  </div>

  <!-- Chart + Top items -->
  <div class="cols">
    <div class="card fade">
      <div class="card-title">Weekly Revenue</div>
      <div class="card-sub">Last 7 days</div>
      <div class="chart-wrap"><canvas id="weeklyChart"></canvas></div>
    </div>
    <div class="card fade" style="animation-delay:.1s">
      <div class="card-title">Top Items</div>
      <div class="card-sub">Today by revenue</div>
      <div id="top-items">
        <div class="skel" style="height:44px;margin-bottom:10px"></div>
        <div class="skel" style="height:44px;margin-bottom:10px"></div>
        <div class="skel" style="height:44px"></div>
      </div>
    </div>
  </div>

  <!-- Recent sales -->
  <div class="card fade" style="animation-delay:.2s">
    <div class="card-title">Recent Sales</div>
    <div class="card-sub">Latest transactions</div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Category</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="recent-body">
          <tr><td colspan="5"><div class="skel" style="height:36px"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer>Refreshes every 60 s &nbsp;·&nbsp; La Maison Boutique</footer>
</main>

<script>
// ── Date ──
const fmt$ = v => '$' + Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
document.getElementById('today-date').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

// ── Chart ──
Chart.defaults.color       = '#9e8f7e';
Chart.defaults.font.family = "'Jost', sans-serif";
Chart.defaults.font.size   = 11;
Chart.defaults.font.weight = '300';
Chart.defaults.borderColor = '#ede7dd';
Chart.defaults.plugins.legend.display = false;

let weeklyChart;

// ── KPIs ──
async function loadSummary() {
  const d = await fetch('/api/summary').then(r => r.json());
  const defs = [
    {key:'revenue',    label:'Revenue',    fmt:fmt$},
    {key:'orders',     label:'Orders',     fmt:v=>v},
    {key:'units',      label:'Units',      fmt:v=>v},
    {key:'avg_ticket', label:'Avg. Ticket',fmt:fmt$},
  ];
  document.getElementById('kpi-row').innerHTML = defs.map(({key,label,fmt}) => {
    const {value, delta} = d[key];
    const cls   = delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat';
    const arrow = delta > 0 ? '↑' : delta < 0 ? '↓' : '—';
    const sign  = delta > 0 ? '+' : '';
    return `
      <div class="kpi">
        <div class="kpi-label">${label}</div>
        <div class="kpi-val">${fmt(value)}</div>
        <div class="kpi-delta ${cls}">${arrow} ${sign}${delta}% vs yesterday</div>
      </div>`;
  }).join('');
}

// ── Weekly chart ──
async function loadWeekly() {
  const rows = await fetch('/api/weekly').then(r => r.json());
  const labels = rows.map(r => new Date(r.day+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'}));
  const values = rows.map(r => r.revenue);

  const barColors = values.map((_,i) =>
    i === values.length - 1 ? '#c9826a' : '#d4c9b8'
  );

  const data = {
    labels,
    datasets:[{
      data: values,
      backgroundColor: barColors,
      borderRadius: 4,
      borderSkipped: false,
    }]
  };

  if (weeklyChart) { weeklyChart.data = data; weeklyChart.update(); return; }
  weeklyChart = new Chart(document.getElementById('weeklyChart'),{
    type:'bar', data,
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ tooltip:{ callbacks:{ label: c => ' '+fmt$(c.raw) } } },
      scales:{
        x:{ grid:{display:false} },
        y:{ grid:{color:'#ede7dd'}, ticks:{callback:v=>'$'+v} }
      }
    }
  });
}

// ── Top items ──
async function loadTopItems() {
  const rows = await fetch('/api/top_items').then(r => r.json());
  const max  = rows[0]?.revenue || 1;
  document.getElementById('top-items').innerHTML = rows.length
    ? rows.map(r => `
      <div class="item-row">
        <div style="flex:1;min-width:0">
          <div class="item-name">${r.name}</div>
          <div class="item-cat">${r.category}</div>
          <div class="item-bar-bg"><div class="item-bar" style="width:${Math.round(r.revenue/max*100)}%"></div></div>
        </div>
        <div style="text-align:right">
          <div class="item-rev">${fmt$(r.revenue)}</div>
          <div class="item-cat">${r.units} sold</div>
        </div>
      </div>`).join('')
    : '<p style="color:var(--taupe);font-size:.8rem;padding:12px 0">No sales recorded today yet.</p>';
}

// ── Recent sales ──
async function loadRecent() {
  const rows = await fetch('/api/recent').then(r => r.json());
  document.getElementById('recent-body').innerHTML = rows.length
    ? rows.map(r => `
      <tr>
        <td>${r.name}</td>
        <td><span class="pill">${r.category}</span></td>
        <td>${r.quantity}</td>
        <td><span class="amt">${fmt$(r.total)}</span></td>
        <td class="time-col">${new Date(r.sold_at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</td>
      </tr>`).join('')
    : '<tr><td colspan="5" style="color:var(--taupe)">No transactions yet.</td></tr>';
}

// ── Load all ──
function loadAll() {
  Promise.all([loadSummary(), loadWeekly(), loadTopItems(), loadRecent()]);
}

loadAll();
setInterval(loadAll, 60_000);
</script>
</body>
</html>
